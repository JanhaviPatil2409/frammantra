<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmMantra - Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .navbar h1 { font-size: 20px; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
        }

        .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 40px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            background: white;
            color: #2e7d32;
            border: 1.5px solid #2e7d32;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab.active { background: #2e7d32; color: white; }

        .panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 { color: #2e7d32; font-size: 18px; margin-bottom: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .form-grid .wide { grid-column: 1 / -1; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 70px; }
        input:focus, textarea:focus { border-color: #2e7d32; }

        .btn {
            padding: 10px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #1b5e20; }
        .btn.small { padding: 6px 12px; font-size: 12px; }
        .btn.secondary { background: #607d8b; }
        .btn.secondary:hover { background: #455a64; }
        .btn.danger { background: #c62828; }
        .btn.danger:hover { background: #8e0000; }

        .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .filters > div { flex: 1; min-width: 180px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 2px solid transparent;
        }
        .card.sold { opacity: 0.6; }
        .card .top { display: flex; justify-content: space-between; align-items: center; }
        .card h3 { font-size: 17px; }
        .badge {
            font-size: 11px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge.sold { background: #eceff1; color: #607d8b; }
        .price { font-size: 20px; font-weight: 700; color: #2e7d32; }
        .meta { font-size: 13px; color: #555; }
        .desc { font-size: 13px; color: #666; line-height: 1.5; }
        .date { font-size: 12px; color: #999; }
        .seller { font-size: 13px; color: #444; margin-top: 6px; padding-top: 8px; border-top: 1px solid #eee; }
        .seller a { color: #2e7d32; font-weight: 600; text-decoration: none; }
        .own { font-size: 12px; color: #2e7d32; font-weight: 600; margin-top: 6px; }
        .actions { display: flex; gap: 8px; margin-top: 8px; }

        .msg { font-size: 13px; margin-top: 12px; }
        .msg.ok { color: #2e7d32; }
        .msg.err { color: #c62828; }

        .empty { text-align: center; color: #888; padding: 30px; grid-column: 1 / -1; }
        .error { color: #c62828; }
    </style>
</head>
<body>

<div class="navbar">
    <h1>🌾 FarmMantra</h1>
    <a class="back-btn" href="/dashboard">← Dashboard</a>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab active" id="tabBtnBrowse" onclick="showTab('browse')">Browse produce</button>
        <button class="tab" id="tabBtnMine" onclick="showTab('mine')">My listings</button>
    </div>

    <!-- BROWSE -->
    <section id="tab-browse">
        <div class="panel">
            <div class="filters">
                <div>
                    <label for="filterCrop">Crop</label>
                    <input type="text" id="filterCrop" placeholder="e.g. Cotton">
                </div>
                <div>
                    <label for="filterLocation">Location</label>
                    <input type="text" id="filterLocation" placeholder="e.g. Nashik">
                </div>
                <button class="btn" onclick="loadBrowse()">Search</button>
            </div>
        </div>
        <div class="grid" id="browseList"></div>
    </section>

    <!-- MY LISTINGS -->
    <section id="tab-mine" style="display: none;">
        <div class="panel">
            <h2>Post produce for sale</h2>
            <div class="form-grid">
                <div>
                    <label for="fCrop">Crop</label>
                    <input type="text" id="fCrop" list="cropList" placeholder="e.g. Cotton">
                    <datalist id="cropList">
                        <option value="Cotton"></option>
                        <option value="Soybean"></option>
                        <option value="Groundnut"></option>
                        <option value="Rice"></option>
                        <option value="Ragi"></option>
                        <option value="Wheat"></option>
                        <option value="Sugarcane"></option>
                        <option value="Onion"></option>
                        <option value="Tomato"></option>
                    </datalist>
                </div>
                <div>
                    <label for="fQty">Quantity (kg)</label>
                    <input type="number" id="fQty" min="1" step="any" placeholder="e.g. 500">
                </div>
                <div>
                    <label for="fPrice">Price per kg (₹)</label>
                    <input type="number" id="fPrice" min="1" step="any" placeholder="e.g. 32">
                </div>
                <div>
                    <label for="fLoc">Location</label>
                    <input type="text" id="fLoc" placeholder="e.g. Nashik">
                </div>
                <div class="wide">
                    <label for="fDesc">Description (optional)</label>
                    <textarea id="fDesc" placeholder="Variety, quality, harvest date, pickup details..."></textarea>
                </div>
            </div>
            <div style="margin-top: 14px;">
                <button class="btn" onclick="createListing()">Post listing</button>
            </div>
            <div class="msg" id="formMsg"></div>
        </div>

        <h2>Your listings</h2>
        <div class="grid" id="mineList"></div>
    </section>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) {
        window.location.href = "/login-page";
    }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const money = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });

    const fmtDate = iso => new Date(iso).toLocaleDateString("en-IN",
        { day: "numeric", month: "short", year: "numeric" });

    const val = id => document.getElementById(id).value.trim();

    async function api(path, method = "GET", body) {
        const opts = { method, headers: { "Authorization": "Bearer " + token } };
        if (body !== undefined) {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
        }
        const res = await fetch(path, opts);

        if (res.status === 401) {
            localStorage.removeItem("token");
            window.location.href = "/login-page";
            throw new Error("Session expired. Please log in again.");
        }

        const text = await res.text();
        if (!res.ok) throw new Error(text || "Request failed (" + res.status + ")");
        return text ? JSON.parse(text) : null;
    }

    function showTab(name) {
        const isBrowse = name === "browse";
        document.getElementById("tab-browse").style.display = isBrowse ? "block" : "none";
        document.getElementById("tab-mine").style.display = isBrowse ? "none" : "block";
        document.getElementById("tabBtnBrowse").classList.toggle("active", isBrowse);
        document.getElementById("tabBtnMine").classList.toggle("active", !isBrowse);
        if (isBrowse) loadBrowse(); else loadMine();
    }

    function card(l) {
        const sold = l.status === "SOLD";

        const footer = l.mine
            ? `<div class="own">Your listing</div>
               <div class="actions">
                   <button class="btn small secondary" onclick="setStatus(${l.id}, '${sold ? "AVAILABLE" : "SOLD"}')">
                       ${sold ? "Reopen" : "Mark sold"}
                   </button>
                   <button class="btn small danger" onclick="removeListing(${l.id})">Delete</button>
               </div>`
            : `<div class="seller">
                   Seller: ${esc(l.sellerName)}<br>
                   <a href="tel:${esc(l.sellerPhone)}">📞 ${esc(l.sellerPhone)}</a>
               </div>`;

        return `
            <div class="card ${sold ? "sold" : ""}">
                <div class="top">
                    <h3>${esc(l.cropName)}</h3>
                    <span class="badge ${sold ? "sold" : ""}">${sold ? "Sold" : "Available"}</span>
                </div>
                <div class="price">${money(l.pricePerKg)} / kg</div>
                <div class="meta">${esc(l.quantityKg)} kg · ${esc(l.location)}</div>
                ${l.description ? `<div class="desc">${esc(l.description)}</div>` : ""}
                <div class="date">Listed ${esc(fmtDate(l.createdAt))}</div>
                ${footer}
            </div>`;
    }

    function renderList(containerId, list, emptyText) {
        const box = document.getElementById(containerId);
        box.innerHTML = list.length
            ? list.map(card).join("")
            : `<div class="empty">${esc(emptyText)}</div>`;
    }

    async function loadBrowse() {
        const box = document.getElementById("browseList");
        const params = new URLSearchParams();
        const crop = val("filterCrop");
        const loc = val("filterLocation");
        if (crop) params.set("crop", crop);
        if (loc) params.set("location", loc);

        try {
            const list = await api("/api/marketplace/listings?" + params.toString());
            renderList("browseList", list, "No produce listed right now. Check back soon.");
        } catch (e) {
            box.innerHTML = `<div class="empty error">${esc(e.message)}</div>`;
        }
    }

    async function loadMine() {
        try {
            const list = await api("/api/marketplace/mine");
            renderList("mineList", list, "You haven't posted any listings yet.");
        } catch (e) {
            document.getElementById("mineList").innerHTML =
                `<div class="empty error">${esc(e.message)}</div>`;
        }
    }

    async function createListing() {
        const body = {
            cropName: val("fCrop"),
            quantityKg: parseFloat(val("fQty")),
            pricePerKg: parseFloat(val("fPrice")),
            location: val("fLoc"),
            description: val("fDesc")
        };

        const msg = document.getElementById("formMsg");
        if (!body.cropName || !(body.quantityKg > 0) || !(body.pricePerKg > 0) || !body.location) {
            msg.className = "msg err";
            msg.innerText = "Please fill in crop, quantity, price and location.";
            return;
        }

        try {
            await api("/api/marketplace/listings", "POST", body);
            ["fCrop", "fQty", "fPrice", "fLoc", "fDesc"].forEach(id =>
                document.getElementById(id).value = "");
            msg.className = "msg ok";
            msg.innerText = "Listing posted!";
            loadMine();
        } catch (e) {
            msg.className = "msg err";
            msg.innerText = e.message;
        }
    }

    async function setStatus(id, value) {
        try {
            await api(`/api/marketplace/listings/${id}/status?value=${value}`, "PATCH");
            loadMine();
        } catch (e) {
            alert(e.message);
        }
    }

    async function removeListing(id) {
        if (!confirm("Delete this listing?")) return;
        try {
            await api(`/api/marketplace/listings/${id}`, "DELETE");
            loadMine();
        } catch (e) {
            alert(e.message);
        }
    }

    loadBrowse();
</script>
</body>
</html>
