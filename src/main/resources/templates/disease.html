<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmMantra - Disease Detection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .navbar h1 { font-size: 20px; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }
        .full { grid-column: 1 / -1; }

        .panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 22px;
        }
        h2 { color: #2e7d32; font-size: 18px; margin-bottom: 14px; }
        h4 { font-size: 14px; color: #2e7d32; margin: 14px 0 6px; }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
        select, input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        .field { margin-bottom: 14px; }

        .preview {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 10px;
            background: #f5f5f5;
            display: none;
            margin-bottom: 14px;
        }

        .btn {
            padding: 11px 22px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #1b5e20; }
        .btn:disabled { background: #9e9e9e; cursor: wait; }

        .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
        .msg.err { color: #c62828; }

        /* Result */
        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .result-head.healthy { background: #e8f5e9; color: #2e7d32; }
        .result-head.sick { background: #ffebee; color: #c62828; }
        .result-head .label { font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .result-head h3 { font-size: 18px; color: #333; margin-top: 2px; }
        .conf { font-size: 22px; font-weight: 700; }

        .warning {
            background: #fff8e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .desc { font-size: 14px; line-height: 1.6; color: #444; }
        ul { padding-left: 20px; font-size: 14px; line-height: 1.7; color: #444; }

        .disclaimer {
            margin-top: 16px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* History */
        .history { display: grid; gap: 10px; }
        .hist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid #eee;
            border-radius: 10px;
            font-size: 14px;
        }
        .hist-item .sub { font-size: 12px; color: #888; margin-top: 2px; }
        .tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag.healthy { background: #e8f5e9; color: #2e7d32; }
        .tag.sick { background: #ffebee; color: #c62828; }

        .empty { color: #888; font-size: 14px; text-align: center; padding: 20px; }

        @media (max-width: 720px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>🌾 FarmMantra</h1>
    <a class="back-btn" href="/dashboard">← Dashboard</a>
</div>

<div class="container">
    <div class="panel">
        <h2>Check your crop</h2>
        <div class="field">
            <label for="crop">Crop</label>
            <select id="crop">
                <option>Cotton</option>
                <option>Soybean</option>
                <option>Groundnut</option>
                <option>Tomato</option>
                <option>Potato</option>
                <option>Maize</option>
                <option>Wheat</option>
                <option>Rice</option>
                <option>Sugarcane</option>
                <option>Ragi</option>
                <option>Other</option>
            </select>
        </div>
        <div class="field">
            <label for="photo">Leaf photo (JPG or PNG, up to 5 MB)</label>
            <input type="file" id="photo" accept="image/jpeg,image/png">
        </div>
        <img id="preview" class="preview" alt="Selected leaf">
        <button class="btn" id="analyseBtn" onclick="detect()">Analyse leaf</button>
        <div class="msg" id="formMsg"></div>
    </div>

    <div class="panel" id="resultPanel">
        <h2>Result</h2>
        <div class="empty">Upload a clear, close-up photo of an affected leaf to see the diagnosis.</div>
    </div>

    <div class="panel full">
        <h2>Your past checks</h2>
        <div class="history" id="historyList">
            <div class="empty">Loading…</div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    if (!token) {
        window.location.href = "/login-page";
    }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const pct = c => Math.round(Number(c) * 100) + "%";

    const fmtDate = iso => new Date(iso).toLocaleDateString("en-IN",
        { day: "numeric", month: "short", year: "numeric" });

    const listHtml = items => items && items.length
        ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";

    async function api(path, opts = {}) {
        opts.headers = { ...(opts.headers || {}), "Authorization": "Bearer " + token };
        const res = await fetch(path, opts);

        if (res.status === 401) {
            localStorage.removeItem("token");
            window.location.href = "/login-page";
            throw new Error("Session expired. Please log in again.");
        }

        const text = await res.text();
        if (!res.ok) throw new Error(text || "Request failed (" + res.status + ")");
        return text ? JSON.parse(text) : null;
    }

    // Show a preview of the chosen photo
    document.getElementById("photo").addEventListener("change", e => {
        const file = e.target.files[0];
        const img = document.getElementById("preview");
        if (file) {
            img.src = URL.createObjectURL(file);
            img.style.display = "block";
        } else {
            img.style.display = "none";
        }
    });

    async function detect() {
        const file = document.getElementById("photo").files[0];
        const crop = document.getElementById("crop").value;
        const msg = document.getElementById("formMsg");
        const btn = document.getElementById("analyseBtn");

        if (!file) {
            msg.className = "msg err";
            msg.innerText = "Please choose a leaf photo first.";
            return;
        }

        const form = new FormData();
        form.append("file", file);
        form.append("cropName", crop);

        btn.disabled = true;
        btn.innerText = "Analysing…";
        msg.className = "msg";
        msg.innerText = "";

        try {
            const result = await api("/api/disease/detect", { method: "POST", body: form });
            renderResult(result);
            loadHistory();
        } catch (e) {
            msg.className = "msg err";
            msg.innerText = e.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Analyse leaf";
        }
    }

    function renderResult(r) {
        const warning = r.warning ? `<div class="warning">⚠️ ${esc(r.warning)}</div>` : "";
        const description = r.description ? `<p class="desc">${esc(r.description)}</p>` : "";

        const sections = r.healthy ? "" : `
            <h4>Chemical treatment</h4>${listHtml(r.chemical) || "<p class='desc'>None listed.</p>"}
            <h4>Organic options</h4>${listHtml(r.organic) || "<p class='desc'>None listed.</p>"}
            <h4>Prevention</h4>${listHtml(r.prevention) || "<p class='desc'>None listed.</p>"}`;

        document.getElementById("resultPanel").innerHTML = `
            <h2>Result</h2>
            <div class="result-head ${r.healthy ? "healthy" : "sick"}">
                <div>
                    <div class="label">${r.healthy ? "Plant looks healthy" : "Likely problem"}</div>
                    <h3>${esc(r.diseaseName)}</h3>
                </div>
                <div class="conf">${pct(r.confidence)}</div>
            </div>
            ${warning}
            ${description}
            ${sections}
            <div class="disclaimer">
                AI results are estimates. Confirm with your local KVK or agronomist before
                spraying any chemical, and follow label doses.
            </div>`;
    }

    async function loadHistory() {
        const box = document.getElementById("historyList");
        try {
            const items = await api("/api/disease/history");
            box.innerHTML = items.length
                ? items.map(h => `
                    <div class="hist-item">
                        <div>
                            <strong>${esc(h.diseaseName)}</strong> · ${esc(h.cropName)}
                            <div class="sub">${esc(fmtDate(h.createdAt))} · ${pct(h.confidence)} confidence</div>
                        </div>
                        <span class="tag ${h.healthy ? "healthy" : "sick"}">${h.healthy ? "Healthy" : "Issue found"}</span>
                    </div>`).join("")
                : `<div class="empty">No checks yet.</div>`;
        } catch (e) {
            box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
    }

    loadHistory();
</script>
</body>
</html>
