<!DOCTYPE html>
<html>
<head>
    <title>FarmMantra - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { color: #2e7d32; font-size: 26px; }
        .logo p { color: #888; font-size: 13px; margin-top: 4px; }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus { border-color: #2e7d32; }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover { background: #1b5e20; }

        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .msg.error { background: #ffebee; color: #c62828; display: block; }
        .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🌾 FarmMantra</h1>
        <p>Create your account</p>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
    </div>

    <div class="form-group">
        <label>Register As</label>
        <select id="role">
            <option value="FARMER">🌾 Farmer</option>
            <option value="BUYER">🛒 Buyer</option>
        </select>
    </div>

    <div class="form-group">
        <label>Location (District)</label>
        <input type="text" id="location" placeholder="e.g. Nashik, Pune">
    </div>

    <div class="form-group">
        <label>Soil Type</label>
        <select id="soilType">
            <option value="BLACK">Black Soil</option>
            <option value="RED">Red Soil</option>
            <option value="ALLUVIAL">Alluvial Soil</option>
            <option value="LATERITE">Laterite Soil</option>
            <option value="SANDY">Sandy Soil</option>
        </select>
    </div>

    <button onclick="register()">Create Account</button>

    <div class="msg" id="msg"></div>

    <!-- ✅ FIXED LINK -->
    <div class="login-link">
        Already have an account? <a href="/login-page">Login here</a>
    </div>
</div>

<script>
function register() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;
    const location = document.getElementById("location").value.trim();
    const soilType = document.getElementById("soilType").value;
    const msg = document.getElementById("msg");

    if (!name || !phone || !password) {
        msg.className = "msg error";
        msg.innerText = "Please fill all required fields!";
        return;
    }

    if (phone.length !== 10) {
        msg.className = "msg error";
        msg.innerText = "Phone number must be 10 digits!";
        return;
    }

    if (password.length < 6) {
        msg.className = "msg error";
        msg.innerText = "Password must be at least 6 characters!";
        return;
    }

    fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, phone, password, role, location, soilType })
    })
    .then(res => {
        if (!res.ok) throw new Error("Registration failed");
        return res.text();
    })
    .then(response => {
        msg.className = "msg success";
        msg.innerText = "Account created! Redirecting to login...";

        // ✅ FIXED REDIRECT
        setTimeout(() => {
            window.location.href = "/login-page";
        }, 1200);
    })
    .catch(err => {
        msg.className = "msg error";
        msg.innerText = err.message;
    });
}
</script>
</body>
</html>
