spring.application.name=farmmantra
server.port=${PORT:8081}

# Local secrets (ignored by Git). On a server, set environment variables instead.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farmmantra_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:farmmantra}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.expiration=86400000

plantid.url=https://plant.id/api/v3/health_assessment

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB