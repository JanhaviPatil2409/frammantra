spring.application.name=farmmantra
server.port=8081

# Local secrets (ignored by Git). On a server, set environment variables instead.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/farmmantra_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=farmmantra
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.expiration=86400000

plantid.url=https://plant.id/api/v3/health_assessment

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB